# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
gui:
    # Pin the files pane to tree view.
    showFileTree: true
git:
    # Render diffs through delta with the same features as the shell pager in config/git/config.
    diffRenderers:
        - type: stdinFilter
          colorArg: always
          command: delta --paging=never --features "default-feature dark-mode"
    # Auto-fetch only the current branch's remote instead of every remote.
    fetchAll: false
