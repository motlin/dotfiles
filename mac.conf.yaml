- defaults:
      link:
          relink: true
          force: false
      shell:
          quiet: true
          stdout: true
          stderr: true

- clean: ['~']

- create:
      - ~/.1password
      - ~/.config/yt-dlp

# Before the link block: ~/.secrets.local needs `secrets` to exist even when op can't fill it.
- shell:
      - command: if [ -f secrets.tpl ]; then ./scripts/mac/op-inject-if-signed-in.sh secrets.tpl secrets; fi && touch secrets && chmod 600 secrets
        description: 🔐 Resolving op:// references into secrets

- link:
      # The socket appears once the 1Password SSH agent is turned on.
      ~/.1password/agent.sock:
          path: ~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock
          ignore-missing: true
      ~/.alias.local:
          path: alias.mac
      ~/.config/1Password/ssh/agent.toml:
          path: config/1Password/ssh/agent.toml
          create: true
          force: true
      ~/.config/yt-dlp/config:
          path: config/yt-dlp/config
      ~/.config/git/config.local:
          path: config/git/config.mac
          force: true
      ~/.env.local:
          path: env.mac
      ~/.secrets.local:
          path: secrets
      ~/.iterm2_shell_integration.zsh:
      ~/.iterm2:
      ~/.ssh/config:
          path: ssh/config
          create: true
      ~/.ssh/factorio_id_ed25519.pub:
          path: ssh/factorio_id_ed25519.pub
          create: true
      ~/.ssh/id_ed25519.pub:
          path: ssh/id_ed25519.pub
          create: true
      ~/.zprofile.local:
          path: zprofile.mac
      ~/.zshrc.local:
          path: zshrc.mac

- shell:
      - command: mkdir -p ~/.config/broot/launcher/zsh && broot --print-shell-function zsh > ~/.config/broot/launcher/zsh/br
        description: 🐚 Writing the broot zsh launcher
      - command: ./scripts/run-quietly.sh pipx install powerline-status
        description: 🎨 Installing powerline
      - command: ./scripts/mac/op-inject-if-signed-in.sh bin/woof.tpl bin/woof && if [ -f bin/woof ]; then chmod +x bin/woof; fi
        description: 🔐 Injecting secrets into bin/woof
      - command: ./scripts/run-quietly.sh ./scripts/mac/defaults.sh
        description: ⚙️ Applying macOS System Settings
      - command: ./scripts/run-quietly.sh ./scripts/mac/install-1password-agent-tools.sh
        description: 🔐 Adding the 1Password MCP server to Claude and Codex
      - command: ./scripts/run-quietly.sh ./scripts/mac/default-apps.sh
        description: 🎬 Setting IINA as the default video player
      - command: >-
            ./scripts/run-quietly.sh ./scripts/clone-or-update.sh git-clones
            https://github.com/motlin/jetbrains-settings.git read-only
        description: 📥 Cloning/updating jetbrains-settings
      - command: ./scripts/mac/jetbrains-settings.sh git-clones/motlin/jetbrains-settings
        description: 🎨 Installing JetBrains color schemes and templates
